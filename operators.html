    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
    </head>
    <body>
        <script>
            //1. Arithmetic Operators
                //Used for math and calculations.

            // "+" (Addition): `5 + 2` → `7` 
            // (Also used for strings: `"Hello " + "World"` → `"Hello World"`)
            // "-" (Subtraction): `10 - 4` → `6`
            // "*" (Multiplication): `3 * 4` → `12`
            // "**" (Exponentiation): `2 ** 3` → `8`
            // "/" (Division): `20 / 5` → `4`
            // "%" (Modulus): `10 % 3` → `1` (The remainder of 10 divided by 3)
            // "++" (Increment): `let x = 5; x++;` → `x` becomes `6`
            // "--" (Decrement): `let y = 5; y--;` → `y` becomes `4`

        //2. Logical Operators
            //Used to combine or manipulate Boolean values.

            // "&&"" (AND): `(5 > 3 && 10 < 20)` → `true` (Both sides must be true)
            // "||"" (OR): `(5 > 10 || 10 < 20)` → `true` (Only one side needs to be true)
            // "!"(NOT): `!(5 > 3)` → `false` (Flips the result)
            // "??" (Nullish Coalescing): `let name = null ?? "Guest";` → `"Guest"` (Uses the fallback if the value is `null` or `undefined`)

        //3. Assignment Operators
            //Used to store values in variables.

            //"=" (Assign): `let x = 10;`
            //"+=" (Add & Assign): `x += 5;` → `15` (Same as `x = x + 5`)
            //"-=" (Sub & Assign): `x -= 2;` → `8` (Same as `x = x - 2`)
            //"*=" (Mult & Assign): `x *= 3;` → `30` (Same as `x = x * 3`)

        //4. Comparison Operators
            //Used to test relationships. These always return `true` or `false`.

            // "==" (Equal): `5 == "5"` → `true` (Checks value only)
            // "===" (Strict Equal): `5 === "5"` → `false` (Checks value **and** data type)
            // "!=" (Not Equal): `5 != 8` → `true`
            // "!==" (Strict Not Equal): `5 !== "5"` → `true`
            // ">" / `<`: `10 > 5` → `true`
            // ">=" / `<=`: `10 >= 10` → `true`

        //5. Bitwise Operators
            //Operate on the binary (bits) level of a number.

            // "&" (AND):** `5 & 1` → `1` (Binary `0101 & 0001 = 0001`)
            // "|" (OR):** `5 | 1` → `5` (Binary `0101 | 0001 = 0101`)
            // "^" (XOR):** `5 ^ 1` → `4` (Binary `0101 ^ 0001 = 0100`)

        //6. Special Operators

            // "typeof":** `typeof 42` → `"number"` | `typeof "Hi"` → `"string"`
            // "instanceof":** `[] instanceof Array` → `true`
            // "? :" (Ternary):** `let access = age > 18 ? "Yes" : "No";`
            // "delete":** `delete user.name;` (Removes a property from an object)

        </script>
    </body>
    </html>
</body>
</html>
