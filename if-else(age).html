<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 id="vote"></h1>
    <script>
        let a = document.getElementById("vote")
        let age = prompt("Enter a Your Age");
        if(age>=18){
            a.innerHTML=(`Above 18, so you can Vote ${age}`);
        }
        else{
            a.innerHTML=(`below 18, so you can NOT Vote ${age}`)
        }
    </script>
</body>
</html>
